<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f4f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1413" media="(prefers-color-scheme: dark)">
  <title>Franko</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <script src="config.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/tax.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="./"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M8 16V8h7M8 12h5"/></svg>Franko</a>
    <div id="periodLabel" class="muted small"></div>
    <span id="syncBadge" class="sync" hidden></span>
  </header>
  <main id="view" tabindex="-1"></main>
  <form id="quick" class="quick" autocomplete="off">
    <input id="quickInput" name="q" enterkeyhint="send">
    <button type="button" id="micBtn" class="icon-btn"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0013 0M12 17.5V21"/></svg></button>
    <button type="submit" id="addBtn" class="icon-btn primary"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  </form>
  <nav class="tabs" id="tabs">
    <button data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-6 8 6v8a1 1 0 01-1 1h-4v-6h-6v6H5a1 1 0 01-1-1z"/></svg><span data-t="tab.home"></span></button>
    <button data-tab="tx"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M5 12h14M5 18h9"/></svg><span data-t="tab.tx"></span></button>
    <button data-tab="plan"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span data-t="tab.plan"></span></button>
    <button data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span data-t="tab.settings"></span></button>
  </nav>
  <dialog id="dlg"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <input type="file" id="stmtFile" accept=".csv,.txt,text/csv" hidden>
  <input type="file" id="restoreFile" accept=".json,application/json" hidden>
</body>
</html>
